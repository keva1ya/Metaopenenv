name: LoanApprovalOpenEnv
version: "1.0"
description: >
  Three-level multi-agent loan approval system.
  Sub-agents feed head agents who vote.
  Big Brain DQN makes final decision.
  Trained via reinforcement learning with dissent feedback.

tasks: [easy, medium, hard]
modes: [normal, mortgage_mode]
action_space: [APPROVE, REJECT, REQUEST_MORE_INFO]

brain:
  type: DQN
  state_dim: 28
  action_dim: 3
  training: GRPO_compatible

reward_range:
  min: -1
  max: 1
